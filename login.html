<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b58">
<title>ننوتل | Qarar Rewards</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f2f5ff;
color:#17234d;
}

header{
background:linear-gradient(135deg,#101b58,#4524a6);
color:white;
padding:22px 16px 35px;
border-radius:0 0 28px 28px;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.logo span{
color:#ffd342;
}

.home{
color:white;
text-decoration:none;
background:#ffffff22;
padding:9px 14px;
border-radius:20px;
font-size:13px;
}

.container{
max-width:500px;
margin:25px auto;
padding:0 15px;
}

.card{
background:white;
border-radius:24px;
padding:25px 20px;
box-shadow:0 8px 25px #18245d18;
}

.icon{
width:70px;
height:70px;
margin:0 auto 15px;
background:#ffd342;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

h1{
text-align:center;
margin:5px 0 8px;
font-size:25px;
}

.subtitle{
text-align:center;
color:#64748b;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:13px 0 7px;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe2f0;
border-radius:13px;
font-family:inherit;
font-size:14px;
outline:none;
}

input:focus{
border-color:#4524a6;
box-shadow:0 0 0 3px #4524a615;
}

.password-box{
position:relative;
}

.password-box input{
padding-left:55px;
}

.show{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;margin:0;border:0;border-radius:8px;background:#f2f5ff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:2}

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
font-size:12px;
}

.options label{
margin:0;
font-weight:normal;
display:flex;
align-items:center;
gap:5px;
}

.options input{
width:auto;
}

.forgot{
color:#4524a6;
text-decoration:none;
}

button{
width:100%;
border:0;
padding:15px;
border-radius:14px;
background:linear-gradient(135deg,#ffd342,#ffbd21);
color:#17234d;
font-family:inherit;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.message{
display:none;
margin:15px 0;
padding:12px;
border-radius:12px;
font-size:13px;
text-align:center;
}

.register{
margin-top:20px;
padding:15px;
background:#f2f5ff;
border-radius:15px;
text-align:center;
font-size:13px;
}

.register a{
color:#4524a6;
font-weight:bold;
text-decoration:none;
}

.security{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

.security div{
background:#f8faff;
padding:12px 5px;
border-radius:12px;
text-align:center;
font-size:11px;
color:#64748b;
}

footer{
text-align:center;
padding:25px 10px;
font-size:12px;
color:#64748b;
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">🎁 Qarar <span>Rewards</span></div>
<a class="home" href="index.html">🏠 کور</a>
</nav>
</header>

<div class="container">

<div class="card">

<div class="icon">🔐</div>

<h1>خپل حساب ته ننوتل</h1>

<div class="subtitle">
د Qarar Rewards حساب ته ښه راغلاست
</div>

<form id="loginForm">

<label for="loginEmail">ایمیل یا کارن نوم</label>
<input
type="text"
id="loginEmail"
placeholder="ایمیل یا کارن نوم ولیکئ"
required
>

<label for="loginPassword">پټ نوم</label>

<div class="password-box">
<input
type="password"
id="loginPassword"
placeholder="خپل پټ نوم ولیکئ"
required
>
<button type="button" class="show" onclick="togglePassword()">👁️</button>
</div>

<div class="options">

<label>
<input type="checkbox" id="remember">
ما په یاد وساته
</label>

<a href="#" class="forgot" onclick="alert('د پټ نوم د بیا ترلاسه کولو سیستم به وروسته فعال شي.')">
پټ نوم هېر شوی؟
</a>

</div>

<div id="loginMessage" class="message"></div>

<button type="submit">
🔐 ننوتل
</button>

</form>

<div class="register">
حساب نه لرئ؟
<a href="register.html">نوی حساب جوړ کړئ</a>
</div>

<div class="security">
<div>🔒 خوندي سیستم</div>
<div>⚡ چټک لاسرسی</div>
</div>

</div>
</div>

<footer>
© 2026 Qarar Rewards — ټول حقوق خوندي دي
</footer>

<script src="js/app.js"></script>

<script>
function togglePassword(){
const p=document.getElementById('loginPassword');
p.type=p.type==='password'?'text':'password';
}
</script>

</body>
</html>
